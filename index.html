<!doctype html>
<html lang="pt-BR">
  <!--
  IMPORTANTE — cache-busting (v0.35.0): todo link/script local abaixo tem
  "?v=X.Y.Z" no final da URL. Isso existe pra resolver o problema de cache
  do navegador/GitHub Pages que já causou confusão várias vezes — sem
  isso, depois de subir uma atualização, era preciso lembrar de dar
  Ctrl+Shift+R manualmente pro navegador buscar os arquivos novos.

  Com o "?v=" mudando a cada versão, o navegador entende que é um arquivo
  DIFERENTE do anterior e busca ele de novo automaticamente, sem precisar
  de refresh forçado.

  REGRA PRA MANTER ISSO FUNCIONANDO: toda vez que uma nova versão for
  publicada, troque o número de versão em TODAS as linhas abaixo (CSS e
  todos os js/*.js) pro número da versão nova — não precisa trocar nos
  scripts de CDN externos (supabase-js, xlsx, jspdf), que já têm versão
  fixa na própria URL.
-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a2647" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" href="icons/icon-192.png" type="image/png" />

      rel="stylesheet"
    />

    <script>
      // Registra o Service Worker (deixa o app instalável como PWA). Se falhar
      // por qualquer motivo, o site continua funcionando normalmente — só não
      // fica instalável/com fallback offline.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service Worker não registrado:', e));
        });
      }
    </script>
