<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- O endereço desta página leva o código secreto da prova do candidato: nada de enviá-lo adiante
         (sem Referer), nada de buscadores, e SEM Sentry/analytics (eles registrariam o endereço com o código). -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Prova — processo seletivo</title>
    <!-- ============================================================
     Página PÚBLICA da prova de conhecimento do processo seletivo — NÃO faz parte do app logado.
     Roda sozinha, sem login: o candidato entra por um link com código único e fala com a Edge Function
     "provas-rs" (ações candidato_abrir / candidato_iniciar / candidato_salvar / candidato_enviar).
     A correção, o cronômetro e o gabarito ficam no SERVIDOR: esta página nunca recebe o gabarito.
     Acesse como: prova.html?t=<código do link>
     ============================================================ -->
    <style>
      :root {
        --gold: #b8894b;
        --ink: #1f2430;
        --ink-dim: #5b6472;
        --ink-faint: #8a92a0;
        --line: #e4e7ec;
        --surface: #ffffff;
        --bg: #f6f7f9;
        --azul: #2563eb;
        --iniciar: #dc2626;
        --alavancar: #16a34a;
        --atencao: #d97706;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, 'Inter', Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }
      .topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
      }
      .topo b {
        font-size: 18px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px 22px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 14px;
        line-height: 1.4;
      }
      .empresa {
        color: var(--ink-dim);
        font-size: 14px;
        margin-bottom: 16px;
      }
      .meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 0 0 16px;
      }
      .chip {
        background: #f1f3f6;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13px;
        color: var(--ink-dim);
      }
      p,
      li {
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-dim);
      }
      .descricao {
        white-space: pre-wrap;
        margin: 0 0 16px;
      }
      ul.regras {
        margin: 0 0 18px;
        padding-left: 20px;
      }
      ul.regras li {
        margin-bottom: 6px;
      }
      .aviso {
        background: #fdf6ec;
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 12.5px;
        color: var(--ink-dim);
        line-height: 1.5;
        margin-bottom: 18px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: var(--azul);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.sec {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.verde {
        background: var(--alavancar);
      }
      .btn:focus-visible,
      .opcao:focus-within,
      .nav button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }
      .barra {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .barra .tit {
        font-size: 13px;
        color: var(--ink-dim);
        font-weight: 600;
      }
      .relogio {
        font-variant-numeric: tabular-nums;
        font-size: 20px;
        font-weight: 700;
        color: var(--ink);
      }
      .relogio.atencao {
        color: var(--atencao);
      }
      .relogio.urgente {
        color: var(--iniciar);
      }
      .progresso {
        font-size: 12.5px;
        color: var(--ink-faint);
      }
      .opcao {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        cursor: pointer;
        font-size: 15px;
        line-height: 1.45;
        color: var(--ink);
      }
      .opcao:hover {
        border-color: #bfdbfe;
      }
      .opcao.marcada {
        border-color: var(--azul);
        background: #eff6ff;
      }
      .opcao input {
        margin-top: 3px;
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      .acoes {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 18px;
      }
      .nav button {
        min-width: 38px;
        height: 38px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 13px;
        cursor: pointer;
        color: var(--ink);
      }
      .nav button.resp {
        background: #dbeafe;
        border-color: #93c5fd;
      }
      .nav button.atual {
        outline: 2px solid var(--azul);
      }
      .estado {
        font-size: 12px;
        color: var(--ink-faint);
        min-height: 16px;
      }
      .estado.erro {
        color: var(--iniciar);
      }
      .centro {
        text-align: center;
      }
      .icone {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 14px;
        background: #eaf7ef;
        color: var(--alavancar);
      }
      .icone.cinza {
        background: #f1f3f6;
        color: var(--ink-dim);
      }
      .confirma {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 10px;
        padding: 14px;
        margin-top: 16px;
      }
      .card.sem-moldura {
        background: none;
        border: 0;
        padding: 0;
      }
      .rodape {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: var(--ink-faint);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topo">
        <b>INETRIS</b>
        <span id="topoDireita"></span>
      </div>
      <div class="card" id="app" aria-live="polite">Carregando prova…</div>
      <div class="rodape">
        Seus dados são tratados conforme a Lei Geral de Proteção de Dados (LGPD) —
        <a href="privacidade.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a>
      </div>
    </div>
    <div id="anuncio" class="sr-only" aria-live="assertive"></div>

    <script>
      // ---- Configuração (mesmos valores públicos que as outras páginas públicas usam) ----
      const SUPABASE_URL = 'https://mgkmvrgfmuexgxkuslur.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_uOz0hehVdqv_7Q2LBzVbzg_J6ZH40fh';

      // Todo texto que vem do servidor (nome da empresa, enunciados, alternativas) passa por aqui antes de virar HTML.
      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      }

      const TOKEN = new URLSearchParams(location.search).get('t') || '';
      const app = document.getElementById('app');

      let dados = null; // o que o servidor mandou (título, tempo, questões SEM gabarito...)
      let respostas = {}; // { idDaQuestão: idDaAlternativa }
      let indice = 0; // questão atual
      let fimEmMs = 0; // instante (relógio local) em que o tempo acaba — recalibrado a cada resposta do servidor
      let relogio = null;
      let salvarTimer = null;
      let pendente = false; // há resposta ainda não salva?
      let confirmando = false;
      let enviando = false;

      async function chamar(action, extra) {
        let resp;
        try {
          resp = await fetch(`${SUPABASE_URL}/functions/v1/provas-rs`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              apikey: SUPABASE_ANON_KEY,
            },
            body: JSON.stringify({ action, token: TOKEN, ...(extra || {}) }),
          });
        } catch (e) {
          return { ok: false, status: 0, data: { error: 'Sem conexão com a internet.' } };
        }
        const data = await resp.json().catch(() => ({}));
        return { ok: resp.ok, status: resp.status, data };
      }

      // ---------- telas ----------
      function telaMensagem(icone, classe, titulo, texto) {
        app.className = 'card';
        app.innerHTML = `<div class="centro"><div class="icone ${classe}">${icone}</div><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div>`;
      }

      function telaIntro() {
        document.title = `${dados.titulo} — prova`;
        app.className = 'card';
        app.innerHTML = `
          <h1>${esc(dados.titulo)}</h1>
          <div class="empresa">Processo seletivo — ${esc(dados.empresa)}</div>
          <div class="meta"><span class="chip">⏱ ${esc(dados.tempoLimiteMin)} minutos</span><span class="chip">📝 ${esc(dados.totalQuestoes)} questões</span></div>
          ${dados.descricao ? `<p class="descricao">${esc(dados.descricao)}</p>` : ''}
          <ul class="regras">
            <li>Você tem <b>uma única tentativa</b>.</li>
            <li>O tempo começa quando você clicar em <b>Iniciar prova</b> e <b>não para</b>, mesmo se você fechar a página.</li>
            <li>Suas respostas são salvas automaticamente enquanto você responde. Se a página recarregar, você continua de onde parou.</li>
            <li>Cada questão tem uma única alternativa correta. Questões em branco contam como erradas.</li>
            <li>Procure um lugar tranquilo e com boa conexão de internet.</li>
          </ul>
          <div class="aviso">
            Esta prova é uma etapa do processo seletivo de <b>${esc(dados.empresa)}</b>. Suas respostas e o resultado serão vistos pela equipe de recrutamento da empresa, que usa a nota como
            apoio — a decisão final é sempre tomada por pessoas. Você pode pedir à empresa a revisão do resultado ou a exclusão dos seus dados.
          </div>
          <button class="btn" id="btnIniciar">Iniciar prova</button>
          <div class="estado" id="estado" style="margin-top:10px"></div>`;
        document.getElementById('btnIniciar').onclick = iniciar;
      }

      function formatarTempo(seg) {
        const m = Math.floor(seg / 60);
        const s = seg % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      function restante() {
        return Math.max(0, Math.ceil((fimEmMs - Date.now()) / 1000));
      }

      function telaProva() {
        const total = dados.questoes.length;
        const q = dados.questoes[indice];
        const respondidas = Object.keys(respostas).length;
        const ultima = indice === total - 1;
        app.className = 'card sem-moldura';
        app.innerHTML = `
          <div class="barra">
            <div><div class="tit">${esc(dados.titulo)}</div><div class="progresso">Questão ${indice + 1} de ${total} · ${respondidas} respondida(s)</div></div>
            <div class="relogio" id="relogio" role="timer" aria-label="Tempo restante">${formatarTempo(restante())}</div>
          </div>
          <div class="card" style="padding:22px 20px">
            <h2 id="enunciado">${indice + 1}. ${esc(q.enunciado)}</h2>
            <div role="radiogroup" aria-labelledby="enunciado">
              ${q.alternativas
                .map(
                  (a, i) => `<label class="opcao ${respostas[q.id] === a.id ? 'marcada' : ''}">
                    <input type="radio" name="alt" value="${esc(a.id)}" ${respostas[q.id] === a.id ? 'checked' : ''} />
                    <span><b>${String.fromCharCode(65 + i)})</b> ${esc(a.texto)}</span>
                  </label>`
                )
                .join('')}
            </div>
            <div class="estado" id="estado"></div>
            <div class="acoes">
              <button class="btn sec" id="btnAnterior" ${indice === 0 ? 'disabled' : ''}>← Anterior</button>
              ${ultima ? '<button class="btn verde" id="btnEnviar">Enviar prova</button>' : '<button class="btn" id="btnProxima">Próxima →</button>'}
            </div>
            <div class="nav" aria-label="Ir para a questão">
              ${dados.questoes.map((x, i) => `<button type="button" data-i="${i}" class="${respostas[x.id] ? 'resp' : ''} ${i === indice ? 'atual' : ''}" aria-label="Questão ${i + 1}${respostas[x.id] ? ', respondida' : ''}">${i + 1}</button>`).join('')}
            </div>
            ${!ultima ? '<div style="margin-top:14px"><button class="btn sec" id="btnEnviarAntes">Enviar prova agora</button></div>' : ''}
            <div id="confirma"></div>
          </div>`;
        app.querySelectorAll('input[name="alt"]').forEach((el) => (el.onchange = () => marcar(q.id, el.value)));
        const ant = document.getElementById('btnAnterior');
        if (ant) ant.onclick = () => ir(indice - 1);
        const prox = document.getElementById('btnProxima');
        if (prox) prox.onclick = () => ir(indice + 1);
        app.querySelectorAll('.nav button').forEach((b) => (b.onclick = () => ir(Number(b.dataset.i))));
        const env = document.getElementById('btnEnviar');
        if (env) env.onclick = pedirConfirmacao;
        const envAntes = document.getElementById('btnEnviarAntes');
        if (envAntes) envAntes.onclick = pedirConfirmacao;
        pintarRelogio();
      }

      function ir(i) {
        if (i < 0 || i >= dados.questoes.length) return;
        indice = i;
        confirmando = false;
        telaProva();
        window.scrollTo({ top: 0 });
      }

      function pedirConfirmacao() {
        const total = dados.questoes.length;
        const faltam = total - Object.keys(respostas).length;
        const caixa = document.getElementById('confirma');
        caixa.innerHTML = `<div class="confirma">
          <p style="margin:0 0 10px;color:var(--ink)"><b>Enviar a prova agora?</b> ${faltam > 0 ? `Você deixou <b>${faltam}</b> questão(ões) em branco — elas contam como erradas.` : 'Você respondeu todas as questões.'} Depois de enviada, não é possível alterar.</p>
          <button class="btn verde" id="btnConfirmar">Sim, enviar</button>
          <button class="btn sec" id="btnVoltar">Voltar à prova</button></div>`;
        document.getElementById('btnConfirmar').onclick = () => enviar(false);
        document.getElementById('btnVoltar').onclick = () => (caixa.innerHTML = '');
        caixa.scrollIntoView({ block: 'center' });
      }

      function pintarRelogio() {
        const el = document.getElementById('relogio');
        if (!el) return;
        const r = restante();
        el.textContent = formatarTempo(r);
        el.className = `relogio ${r <= 60 ? 'urgente' : r <= 300 ? 'atencao' : ''}`;
        if (r === 300 || r === 60)
          document.getElementById('anuncio').textContent = r === 300 ? 'Faltam 5 minutos.' : 'Falta 1 minuto.';
      }

      function iniciarRelogio() {
        clearInterval(relogio);
        relogio = setInterval(() => {
          pintarRelogio();
          if (restante() <= 0 && !enviando) enviar(true); // acabou o tempo: envia o que tem
        }, 1000);
      }

      // ---------- ações ----------
      function marcar(idQuestao, idAlternativa) {
        respostas[idQuestao] = idAlternativa;
        pendente = true;
        // atualiza só o visual (sem refazer a tela) pra não perder o foco do teclado
        app
          .querySelectorAll('.opcao')
          .forEach((l) => l.classList.toggle('marcada', l.querySelector('input').value === idAlternativa));
        app
          .querySelectorAll('.nav button')
          .forEach((b) => b.classList.toggle('resp', !!respostas[dados.questoes[Number(b.dataset.i)].id]));
        const prog = app.querySelector('.progresso');
        if (prog)
          prog.textContent = `Questão ${indice + 1} de ${dados.questoes.length} · ${Object.keys(respostas).length} respondida(s)`;
        clearTimeout(salvarTimer);
        salvarTimer = setTimeout(salvar, 500);
      }

      async function salvar() {
        if (!pendente || enviando) return;
        const estado = document.getElementById('estado');
        const r = await chamar('candidato_salvar', { respostas });
        if (r.ok) {
          pendente = false;
          if (typeof r.data.restanteSegundos === 'number') fimEmMs = Date.now() + r.data.restanteSegundos * 1000; // recalibra com o relógio do servidor
          if (r.data.estado === 'concluida') return telaFim();
          if (estado) {
            estado.className = 'estado';
            estado.textContent = 'Resposta salva ✓';
          }
        } else if (estado) {
          estado.className = 'estado erro';
          estado.textContent = 'Sem conexão — vamos tentar salvar de novo. Suas respostas continuam aqui.';
          clearTimeout(salvarTimer);
          salvarTimer = setTimeout(salvar, 4000);
        }
      }

      async function iniciar() {
        const btn = document.getElementById('btnIniciar');
        btn.disabled = true;
        btn.textContent = 'Iniciando…';
        const r = await chamar('candidato_iniciar');
        if (!r.ok || r.data.estado !== 'iniciada') {
          if (r.ok) return mostrarPorEstado(r.data);
          btn.disabled = false;
          btn.textContent = 'Iniciar prova';
          const estado = document.getElementById('estado');
          estado.className = 'estado erro';
          estado.textContent = r.data.error || 'Não foi possível iniciar. Tente de novo.';
          return;
        }
        comecar(r.data);
      }

      function comecar(d) {
        dados = d;
        respostas = { ...(d.respostas || {}) };
        indice = 0;
        fimEmMs = Date.now() + d.restanteSegundos * 1000;
        document.title = `${d.titulo} — prova em andamento`;
        window.onbeforeunload = () => 'Sua prova está em andamento. O tempo continua correndo se você sair.';
        telaProva();
        iniciarRelogio();
      }

      async function enviar(porTempo) {
        if (enviando) return;
        enviando = true;
        clearInterval(relogio);
        clearTimeout(salvarTimer);
        const caixa = document.getElementById('confirma');
        if (caixa) caixa.innerHTML = '<p>Enviando sua prova…</p>';
        let r = await chamar('candidato_enviar', { respostas });
        for (let tentativa = 0; !r.ok && r.status === 0 && tentativa < 5; tentativa++) {
          // sem internet: tenta de novo algumas vezes antes de avisar
          await new Promise((ok) => setTimeout(ok, 2000));
          r = await chamar('candidato_enviar', { respostas });
        }
        if (r.ok && r.data.estado === 'concluida') return telaFim(porTempo);
        enviando = false;
        if (caixa) {
          caixa.innerHTML = `<div class="confirma"><p style="margin:0 0 10px;color:var(--iniciar)">${esc(r.data.error || 'Não foi possível enviar agora.')} Suas respostas continuam aqui — tente de novo.</p><button class="btn verde" id="btnTentar">Tentar enviar de novo</button></div>`;
          document.getElementById('btnTentar').onclick = () => enviar(false);
        } else {
          telaMensagem(
            '⚠',
            'cinza',
            'Não foi possível enviar',
            r.data.error || 'Verifique sua conexão e recarregue a página.'
          );
        }
        if (restante() > 0) iniciarRelogio();
      }

      function telaFim(porTempo) {
        clearInterval(relogio);
        window.onbeforeunload = null;
        telaMensagem(
          '✓',
          '',
          porTempo ? 'Tempo esgotado — prova enviada' : 'Prova enviada!',
          'Obrigado por participar. A equipe da empresa vai analisar o resultado e entrará em contato sobre os próximos passos. Você já pode fechar esta página.'
        );
      }

      function mostrarPorEstado(d) {
        if (d.estado === 'concluida') return telaFim();
        if (d.estado === 'expirada')
          return telaMensagem(
            '⏳',
            'cinza',
            'O prazo desta prova terminou',
            'O link não está mais válido. Entre em contato com a empresa para pedir um novo link.'
          );
        if (d.estado === 'cancelada')
          return telaMensagem(
            '✕',
            'cinza',
            'Esta prova foi cancelada',
            'Entre em contato com a empresa se você achar que isso foi um engano.'
          );
        if (d.estado === 'iniciada') return comecar(d);
        dados = d;
        telaIntro();
      }

      // ---------- começo ----------
      (async function () {
        if (!/^[A-Za-z0-9_-]{43}$/.test(TOKEN))
          return telaMensagem(
            '?',
            'cinza',
            'Link inválido',
            'Este link de prova está incompleto. Abra o link exatamente como recebido por e-mail ou peça um novo link à empresa.'
          );
        const r = await chamar('candidato_abrir');
        if (!r.ok) {
          if (r.status === 404)
            return telaMensagem('?', 'cinza', 'Link inválido ou expirado', 'Peça um novo link a quem convidou você.');
          if (r.status === 429)
            return telaMensagem('⏳', 'cinza', 'Muitas tentativas', 'Aguarde alguns minutos e abra o link de novo.');
          return telaMensagem(
            '⚠',
            'cinza',
            'Não foi possível abrir a prova',
            r.data.error || 'Verifique sua conexão e recarregue a página.'
          );
        }
        mostrarPorEstado(r.data);
      })();
    </script>
  </body>
</html>
