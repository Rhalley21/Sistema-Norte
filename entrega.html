<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- O endereço desta página leva o código secreto do pedido: nada de enviá-lo adiante (sem Referer), nada de
         buscadores, e SEM Sentry/analytics (eles registrariam o endereço com o código). -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Enviar resultado — processo seletivo</title>
    <!-- ============================================================
     Página PÚBLICA para o candidato devolver o RESULTADO de uma etapa (teste, prova): NÃO faz parte do app logado.
     Ele entra por um link com código único (sem login), anexa até 3 arquivos (PDF, PNG, JPG ou WEBP, 5 MB cada)
     e/ou escreve um texto, e envia UMA vez. Os arquivos vão DIRETO para o armazenamento privado (a função
     "entrega-rs" só autoriza o envio e depois confere o que chegou).
     Acesse como: entrega.html?t=<código do link>
     ============================================================ -->
    <style>
      :root {
        --gold: #b8894b;
        --ink: #1f2430;
        --ink-dim: #5b6472;
        --ink-faint: #8a92a0;
        --line: #e4e7ec;
        --surface: #ffffff;
        --bg: #f6f7f9;
        --azul: #2563eb;
        --iniciar: #dc2626;
        --alavancar: #16a34a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, 'Inter', Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }
      .topo {
        margin-bottom: 18px;
        font-size: 18px;
        font-weight: 700;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 26px 22px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      .empresa {
        color: var(--ink-dim);
        font-size: 14px;
        margin-bottom: 16px;
      }
      p,
      li {
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-dim);
      }
      .instrucoes {
        white-space: pre-wrap;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 0 0 16px;
        color: var(--ink);
      }
      ul.regras {
        margin: 0 0 18px;
        padding-left: 20px;
      }
      ul.regras li {
        margin-bottom: 6px;
      }
      .aviso {
        background: #fdf6ec;
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 12.5px;
        color: var(--ink-dim);
        line-height: 1.5;
        margin-bottom: 18px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: var(--azul);
        color: #fff;
        margin: 0 8px 8px 0;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.sec {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.verde {
        background: var(--alavancar);
      }
      .btn.mini {
        padding: 4px 10px;
        font-size: 12px;
        margin: 0;
      }
      .btn:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }
      .arquivo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 8px;
        font-size: 14px;
        color: var(--ink);
      }
      .arquivo small {
        color: var(--ink-faint);
      }
      #lista {
        margin-bottom: 12px;
      }
      label.campo {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      textarea {
        width: 100%;
        min-height: 110px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        font-size: 14px;
        resize: vertical;
      }
      .contador {
        font-size: 12px;
        color: var(--ink-faint);
        text-align: right;
      }
      .estado {
        font-size: 13px;
        color: var(--ink-dim);
        min-height: 18px;
        margin: 6px 0 10px;
      }
      .estado.erro {
        color: var(--iniciar);
      }
      .centro {
        text-align: center;
      }
      .icone {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 14px;
        background: #eaf7ef;
        color: var(--alavancar);
      }
      .icone.cinza {
        background: #f1f3f6;
        color: var(--ink-dim);
      }
      .rodape {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: var(--ink-faint);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topo">INETRIS</div>
      <div class="card" id="app" aria-live="polite">Carregando…</div>
      <div class="rodape">
        Seus dados são tratados conforme a Lei Geral de Proteção de Dados (LGPD) —
        <a href="privacidade.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a>
      </div>
    </div>

    <!-- Única biblioteca externa: o envio direto ao armazenamento usa o supabase-js. Versão FIXA (nunca "latest"). -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script>
      // ---- Configuração (mesmos valores públicos que as outras páginas públicas usam) ----
      const SUPABASE_URL = 'https://mgkmvrgfmuexgxkuslur.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_uOz0hehVdqv_7Q2LBzVbzg_J6ZH40fh';
      const BUCKET = 'entregas-candidatos';

      // ---- Regras da entrega (testadas) --------------------------------------------------------
      // Os MESMOS limites da função entrega-rs e do armazenamento (um teste confere que não saem de sincronia).
      const LIMITE_ARQUIVOS = 3;
      const LIMITE_BYTES = 5 * 1024 * 1024; // 5 MB por arquivo
      const MIN_BYTES = 100;
      const LIMITE_TEXTO = 3000;
      const FORMATOS = { 'application/pdf': 'pdf', 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };

      function mimeBase(m) {
        return String(m || '')
          .split(';')[0]
          .trim()
          .toLowerCase();
      }
      function tamanhoTexto(bytes) {
        return bytes >= 1048576
          ? `${(bytes / 1048576).toFixed(1).replace('.', ',')} MB`
          : `${Math.max(1, Math.round(bytes / 1024))} KB`;
      }
      // Confere UM arquivo escolhido (formato e tamanho) antes de aceitá-lo na lista.
      function validarArquivoEscolhido(arq) {
        const tipo = mimeBase(arq && arq.tipo);
        if (!FORMATOS[tipo])
          return {
            ok: false,
            erro: 'Formato não aceito. Envie PDF, PNG, JPG ou WEBP (no celular, tire um print da tela).',
          };
        const tamanho = Number(arq.tamanho);
        if (!Number.isInteger(tamanho) || tamanho < MIN_BYTES)
          return { ok: false, erro: 'O arquivo parece vazio ou inválido.' };
        if (tamanho > LIMITE_BYTES)
          return {
            ok: false,
            erro: `O arquivo tem ${tamanhoTexto(tamanho)} e o máximo é ${tamanhoTexto(LIMITE_BYTES)} por arquivo.`,
          };
        return { ok: true, mime: tipo };
      }
      // Dá para adicionar mais um arquivo? (no máximo 3)
      function podeAdicionarArquivo(qtdAtual) {
        return qtdAtual < LIMITE_ARQUIVOS;
      }
      // O envio precisa de pelo menos um arquivo OU um texto.
      function validarEnvio(qtdArquivos, texto) {
        if (qtdArquivos > 0 || String(texto || '').trim()) return { ok: true };
        return { ok: false, erro: 'Anexe pelo menos um arquivo ou escreva o resultado.' };
      }
      // ---- fim: regras da entrega --------------------------------------------------------------

      // Todo texto que vem do servidor (nome da empresa, orientações) ou do arquivo passa por aqui antes de virar HTML.
      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      }

      const TOKEN = new URLSearchParams(location.search).get('t') || '';
      const app = document.getElementById('app');
      let dados = null;
      let escolhidos = []; // arquivos já aceitos: { file, mime }
      let ocupado = false;

      async function chamar(action, extra) {
        let resp;
        try {
          resp = await fetch(`${SUPABASE_URL}/functions/v1/entrega-rs`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              apikey: SUPABASE_ANON_KEY,
            },
            body: JSON.stringify({ action, token: TOKEN, ...(extra || {}) }),
          });
        } catch (e) {
          return { ok: false, status: 0, data: { error: 'Sem conexão com a internet.' } };
        }
        const data = await resp.json().catch(() => ({}));
        return { ok: resp.ok, status: resp.status, data };
      }
      function mensagem(icone, classe, titulo, texto) {
        app.innerHTML = `<div class="centro"><div class="icone ${classe}">${icone}</div><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div>`;
      }
      function dizer(texto, erro) {
        const el = document.getElementById('estado');
        if (!el) return;
        el.className = `estado ${erro ? 'erro' : ''}`;
        el.textContent = texto;
      }

      function desenharLista() {
        const alvo = document.getElementById('lista');
        if (!alvo) return;
        alvo.innerHTML = escolhidos
          .map(
            (e, i) =>
              `<div class="arquivo"><span>${esc(e.file.name)} <small>${esc(tamanhoTexto(e.file.size))}</small></span><button class="btn sec mini" data-remover="${i}" aria-label="Remover ${esc(e.file.name)}">Remover</button></div>`
          )
          .join('');
        alvo.querySelectorAll('[data-remover]').forEach((b) => {
          b.onclick = () => {
            escolhidos.splice(Number(b.getAttribute('data-remover')), 1);
            desenharLista();
            dizer('');
          };
        });
        const botao = document.getElementById('btnAnexar');
        if (botao) botao.style.display = podeAdicionarArquivo(escolhidos.length) ? '' : 'none';
      }

      function telaPrincipal() {
        const mb = Math.round(LIMITE_BYTES / 1048576);
        app.innerHTML = `
          <h1>Enviar resultado</h1>
          <div class="empresa">${esc(dados.etapa)} — ${esc(dados.empresa)}</div>
          ${dados.instrucoes ? `<div class="instrucoes">${esc(dados.instrucoes)}</div>` : ''}
          <ul class="regras">
            <li>Anexe até <b>${LIMITE_ARQUIVOS} arquivos</b> (PDF, PNG, JPG ou WEBP) de até <b>${mb} MB</b> cada. No celular, um print da tela serve.</li>
            <li>Você também pode escrever o resultado em texto (por exemplo, o perfil que apareceu no teste).</li>
            <li>O envio é <b>único</b>: confira antes de enviar. Depois, o resultado não pode ser trocado.</li>
          </ul>
          <div class="aviso">O resultado será visto apenas pela equipe de recrutamento de <b>${esc(dados.empresa)}</b>, usado só neste processo seletivo e guardado por até <b>${esc(dados.limites.retencaoMeses)} meses</b>. Envie só o que for pedido. A decisão final é sempre tomada por pessoas. Você pode pedir à empresa a exclusão do resultado a qualquer momento.</div>
          <div id="lista"></div>
          <label class="btn sec" id="btnAnexar" style="display:inline-block;" for="arquivo">Anexar arquivo</label>
          <input type="file" id="arquivo" accept="application/pdf,image/png,image/jpeg,image/webp" multiple style="display:none" />
          <label class="campo" for="texto">Resultado em texto (opcional)</label>
          <textarea id="texto" maxlength="${LIMITE_TEXTO}" placeholder="Escreva aqui o resultado, se preferir."></textarea>
          <div class="contador" id="contador">0 / ${LIMITE_TEXTO}</div>
          <div class="estado" id="estado"></div>
          <button class="btn verde" id="btnEnviar">Enviar resultado</button>`;
        document.getElementById('arquivo').onchange = escolherArquivos;
        document.getElementById('texto').oninput = (ev) => {
          document.getElementById('contador').textContent = `${ev.target.value.length} / ${LIMITE_TEXTO}`;
        };
        document.getElementById('btnEnviar').onclick = enviar;
        desenharLista();
      }

      function escolherArquivos(ev) {
        const novos = Array.from(ev.target.files || []);
        ev.target.value = '';
        for (const f of novos) {
          if (!podeAdicionarArquivo(escolhidos.length))
            return dizer(`Você já anexou ${LIMITE_ARQUIVOS} arquivos (o máximo).`, true);
          const v = validarArquivoEscolhido({ tipo: f.type, tamanho: f.size });
          if (!v.ok) return dizer(`${f.name}: ${v.erro}`, true);
          escolhidos.push({ file: f, mime: v.mime });
        }
        dizer('');
        desenharLista();
      }

      async function enviar() {
        if (ocupado) return;
        const texto = document.getElementById('texto').value;
        const v = validarEnvio(escolhidos.length, texto);
        if (!v.ok) return dizer(v.erro, true);
        ocupado = true;
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        window.onbeforeunload = () => 'Seu resultado está sendo enviado.';
        const declarados = escolhidos.map((e) => ({ mime: e.mime, tamanho: e.file.size, nome: e.file.name }));
        try {
          dizer('Preparando o envio…');
          const prep = await chamar('candidato_entrega_preparar', { arquivos: declarados });
          if (!prep.ok) throw new Error(prep.data.error || 'Não foi possível preparar o envio.');
          if (prep.data.envios.length) {
            dizer('Enviando os arquivos… não feche esta página.');
            const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            for (const envio of prep.data.envios) {
              const alvo = escolhidos[envio.indice - 1];
              const up = await cliente.storage
                .from(BUCKET)
                .uploadToSignedUrl(envio.caminho, envio.token, alvo.file, { contentType: envio.mime });
              if (up.error)
                throw new Error(`O envio de "${alvo.file.name}" falhou. Verifique sua conexão e tente de novo.`);
            }
          }
          dizer('Conferindo o resultado…');
          const conf = await chamar('candidato_entrega_confirmar', { arquivos: declarados, texto });
          if (!conf.ok) throw new Error(conf.data.error || 'Não foi possível confirmar o envio.');
          window.onbeforeunload = null;
          mensagem(
            '✓',
            '',
            'Resultado enviado!',
            'Obrigado. A equipe da empresa vai analisar o seu resultado e entrará em contato sobre os próximos passos. Você já pode fechar esta página.'
          );
        } catch (e) {
          dizer(`${e.message} Seus arquivos continuam aqui: você pode tentar de novo.`, true);
          btn.disabled = false;
        }
        ocupado = false;
      }

      // ---------- começo ----------
      (async function () {
        if (!/^[A-Za-z0-9_-]{43}$/.test(TOKEN))
          return mensagem(
            '?',
            'cinza',
            'Link inválido',
            'Este link está incompleto. Abra o link exatamente como recebido por e-mail ou peça um novo link à empresa.'
          );
        const r = await chamar('candidato_entrega_abrir');
        if (!r.ok) {
          if (r.status === 404)
            return mensagem('?', 'cinza', 'Link inválido ou expirado', 'Peça um novo link a quem convidou você.');
          if (r.status === 429)
            return mensagem('⏳', 'cinza', 'Muitas tentativas', 'Aguarde alguns minutos e abra o link de novo.');
          return mensagem(
            '⚠',
            'cinza',
            'Não foi possível abrir a página',
            r.data.error || 'Verifique sua conexão e recarregue a página.'
          );
        }
        dados = r.data;
        if (dados.estado === 'enviado')
          return mensagem(
            '✓',
            '',
            'Resultado já enviado',
            'Seu resultado já foi enviado. Obrigado! Não é preciso fazer mais nada.'
          );
        if (dados.estado === 'expirado')
          return mensagem(
            '⏳',
            'cinza',
            'O prazo deste pedido terminou',
            'O link não está mais válido. Entre em contato com a empresa para pedir um novo link.'
          );
        if (dados.estado === 'cancelado')
          return mensagem(
            '✕',
            'cinza',
            'Este pedido foi cancelado',
            'Entre em contato com a empresa se você achar que foi um engano.'
          );
        telaPrincipal();
      })();
    </script>
  </body>
</html>
